name: conflict-main
on:
  workflow_dispatch:
    inputs:
      probekeys:
        required: false
        default: ''
permissions:
  contents: write
  actions: write
  id-token: write
jobs:
  conflictjob:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: n
        run: echo "n=$(cat NONCE.txt)" >> $GITHUB_OUTPUT
      - name: probe
        uses: ./.github/actions/cbprobe
        with:
          mode: conflict
          nonce: ${{ steps.n.outputs.n }}
          ghtok: ${{ github.token }}
          mainkey: cbmain-${{ steps.n.outputs.n }}
          probekey: ${{ inputs.probekeys }}
